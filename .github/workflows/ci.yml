name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  checks:
    # Guide prescribes ci-cd-runner; not available on this personal repo (see README "Deviations").
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.10.10"
      - run: uv sync --frozen --extra dev
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy
      - run: uv run pytest
